<title>What a Country Writes Down | Coming to Terms with the Past | Kula Revise</title>
<style>
  /* ============================================================
     KULA SOURCE ENGINE v3: TOKEN CONTRACT
     This file is fixed mechanism. Do not edit it per series.
     A skin sets the THIRTEEN identity variables in the block below
     and nothing else is required of it.

     Two accents, split by job:
       --a1  accent one: navigation, progress, emphasis, option letters,
             the primary button, the story date. The "structure" accent.
       --a2  accent two: anything the learner earned. Correct answers,
             the running summary, breakdown bars, key facts, the last
             story line. The "reward" accent.
     Set --a1-rgb / --a2-rgb to the SAME colours as r,g,b (no #), because
     the tints, washes and shadows are built from them.
     ============================================================ */

  :root {
    /* ---- THE IDENTITY CONTRACT. A skin overrides these thirteen. ---- */
    --sand:  #F2E9D9;   /* page background */
    --paper: #FBF6EB;   /* cards */
    --cut:   #FFFCF4;   /* insets, sources, carousels */
    --ink:   #1B2A33;   /* body text */
    --clay:  #8C4A2F;   /* stage tags, quiet labels */
    --fade:  #7B7263;   /* muted text, captions */
    --a1: #B4622D;   --a1-rgb: 180,98,45;
    --a2: #1F6B58;   --a2-rgb: 31,107,88;
    --serif: Georgia, 'Times New Roman', serif;
    --sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --mono: ui-monospace, 'Cascadia Code', Consolas, 'Courier New', monospace;

    /* ---- DERIVED TOKENS. A skin should not need to touch these. ----
       They exist because the engine used to hardcode fourteen literal
       colours, which is what made every glossary definition and every
       source expander invisible in dark mode. Everything below now
       tracks the identity variables above, so a skin that sets --fade
       and --ink correctly gets a readable dark mode for free. ---- */
    --muted:      var(--fade);          /* secondary body text: kt-def, toggle-body, disc-body, cover-line */
    --hair:       rgba(0,0,0,0.12);     /* progress track, quiet rules */
    --hair-strong:rgba(0,0,0,0.28);     /* dashed divider inside an expander */
    --on-ink:     var(--paper);         /* text sitting on an --ink ground */
    --on-a1:      var(--paper);         /* text sitting on an --a1 ground */
    --on-a2:      var(--paper);         /* text sitting on an --a2 ground */
    --ink-deep:   #12202a;              /* --ink one step darker, button hover */
    --a2-deep:    #164C3F;              /* --a2 one step darker, button hover */
    --ok-bg:      rgba(var(--a2-rgb),0.13);  /* a correct option, a placed item */
    --no-bg:      rgba(140,74,47,0.13);      /* a wrong option, a misplaced item */
    /* Skill chips. a = the entry-level skill (Extract, Argue, Evidence, Recall).
       b = the middle skill (Interpret, Understand). c = unassessed instinct.
       The top skill (Evaluate, Weigh, Apply) sits on a solid accent ground. */
    --chip-a-bg: rgba(var(--a1-rgb),0.16);  --chip-a-fg: var(--a1);
    --chip-b-bg: rgba(var(--a2-rgb),0.16);  --chip-b-fg: var(--a2);
    --chip-c-bg: rgba(0,0,0,0.06);
    --scrim:  rgba(27,42,51,0.5);       /* modal backdrop */
    --inset:  rgba(255,255,255,0.4);    /* sort column well */

    /* Legacy aliases. Older skins and the quiz shell reference these. */
    --copper: var(--a1);
    --malachite: var(--a2);
  }

  /* ---- DARK MODE TOKEN RE-POINT ---------------------------------------
     The skin supplies body.alt values for the thirteen identity variables.
     Everything derived re-points here, once, for every unit. This is the
     engine-level fix for the three defects logged in MOBILE_FIXES_HANDOVER:
     a skin no longer needs the patch block at all.
     ------------------------------------------------------------------- */
  body.alt {
    --muted:      var(--fade);
    --hair:       rgba(255,255,255,0.14);
    --hair-strong:rgba(255,255,255,0.26);
    --on-ink:     var(--sand);
    --on-a1:      var(--sand);
    --on-a2:      var(--sand);
    --ink-deep:   var(--ink);
    --a2-deep:    var(--a2);
    --ok-bg:      rgba(var(--a2-rgb),0.20);
    --no-bg:      rgba(var(--a1-rgb),0.18);
    --chip-a-bg:  rgba(var(--a1-rgb),0.22);  --chip-a-fg: var(--ink);
    --chip-b-bg:  rgba(var(--a2-rgb),0.22);  --chip-b-fg: var(--ink);
    --chip-c-bg:  rgba(255,255,255,0.10);
    --scrim:  rgba(0,0,0,0.62);
    --inset:  rgba(255,255,255,0.05);
  }
  /* Key term chips keep a visible edge once the ground inverts. */
  body.alt .kt-term { border-color: var(--hair-strong); }
  body.alt .kt-term summary { color: var(--ink); }
  body.alt .kt-label { border-top-color: var(--hair-strong); }
  /* v2 dimmed the options a learner did not pick; at 0.45 they vanish on a dark ground. */
  body.alt .option.dimmed, body.alt .option-btn.dimmed { opacity: 0.72; }

  /* ---- MODE TOGGLE. Fixed bottom right, 44px minimum tap target. ---- */
  .mode-toggle {
    position: fixed; bottom: 0.9rem; right: 0.9rem; z-index: 40;
    display: flex; align-items: center; gap: 0.4rem;
    font-family: var(--sans); font-size: 0.66rem; font-weight: 700;
    letter-spacing: 0.12em; text-transform: uppercase;
    padding: 0.62rem 0.75rem; min-height: 44px;
    background: var(--paper); color: var(--fade);
    border: 1px solid var(--hair-strong); cursor: pointer;
    box-shadow: 0 2px 12px var(--scrim);
  }
  .mode-toggle:hover { color: var(--ink); border-color: var(--a1); }
  .mode-toggle:focus-visible { outline: 2px solid var(--a1); outline-offset: 2px; }
  .mode-toggle svg { width: 0.9rem; height: 0.9rem; fill: none; stroke: currentColor; stroke-width: 1.6; }
  @media (max-width: 520px) {
    .mode-toggle { min-height: 44px; padding: 0.62rem 0.7rem; font-size: 0.64rem; }
  }
  @media print { .mode-toggle { display: none; } }

  /* ---- STICKY HEADER AT 360px --------------------------------------
     .top-meta is a flex row and flex children default to min-width auto,
     so at 360px the eyebrow and the step counter used to overlap. The
     eyebrow now takes the free space and truncates rather than pushing
     the counter off. Renders correctly at 375px and above either way,
     which is why this was missed. 360 is common on mid-range Android.
     ----------------------------------------------------------------- */
  .top-meta { gap: 0.7rem; flex-wrap: nowrap; }
  .top-meta > * { min-width: 0; }
  .top-meta #lesson-tag, .top-meta .top-label {
    flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .top-meta .top-count { flex: 0 0 auto; white-space: nowrap; }
  @media (max-width: 380px) {
    .top-meta { font-size: 0.62rem; letter-spacing: 0.09em; }
  }

/* COMING TO TERMS WITH THE PAST: inscription

   The metaphor is the Wall of Names at Freedom Park: 697 metres of stone with
   75 000 names cut into it, and an argument about who was left off. This unit
   is about a country deciding what to write down and what to leave out, so the
   identity is carved rather than printed.

   Register check, and the tightest constraint first. Coming of Democracy is the
   OTHER strand of this same CAPS topic and holds Minute and Margin, which is a
   record identity: dark navy, orange and green, the look of a document being
   kept. Two strands of one topic must feel like different products, so this one
   stays away from paper, files, minutes and typewriting altogether. Crisis of
   Apartheid holds Drawing Office and sits next to it in the same paper, so no
   crossed rule and no aubergine. Vietnam holds cream and serif, Black
   Consciousness manila and typewriter mono, Black Power the placard press, US
   Civil Rights the newspaper column, Congo the ore seam, Angola cool slate with
   mono labels, Cold War the 45 degree hatch, Stalin sage green.

   House grammar held, all five:
     1. the ground is ruled linearly at very low opacity
     2. one accent per card
     3. labels are filled and tracked
     4. edges stay intact, nothing clipped
     5. sans display over a serif body

   Signature moves, each absent from the register:
     - a horizontal course rule, wide and shallow, like stone laid in courses
     - the card accent is an INCISED head rule: a dark hairline with a light
       line under it, so the edge reads as cut into the surface rather than
       printed on it. Nothing else in the register uses an inset shadow
     - sources are recessed panels with a chiselled left edge
     - bottle green with copper, a pairing nothing else holds

   Palette rationale, and this one was chosen by eye rather than argued from the
   metaphor. Three earlier attempts are worth recording so nobody repeats them.
   Slate blue-green with brass measured fine and read as a quieter Angola. Warm
   bone with haematite went sepia, because having picked a warm accent I also
   warmed the ground, the ink and both greys, so nothing was left neutral for the
   accent to sit against. Neutralising the field fixed the sepia and left
   something correct and drab.

   What works is cool structure with a warm reward. The structure accent appears
   on every border, plate and head rule, so it sets the temperature of the whole
   page; the reward accent appears rarely, so it can be hot without taking over.
   Deep bottle green carries the structure and copper marks anything the learner
   earned. In dark mode the green lifts to a soft jade and the copper to a warm
   amber, which is the best inversion of the four candidates tested.

   Two collisions checked rather than assumed. Stalin holds sage green and
   Vietnam holds sage with teal, and both are pale, cool and low in saturation;
   this is a deep saturated bottle green used as an accent on a near-neutral
   ground, not a green ground. Congo's Ore Seam is warm and coppery, and it is
   warm by radial wash across the whole surface, where copper here is a small
   accent on eight or nine elements per screen.
*/

:root {
  --sand:  #E6EAE5;   /* page: neutral stone, faintly green */
  --paper: #F8FAF7;   /* cards: cut face */
  --cut:   #D8DED7;   /* insets, sources, carousels */
  --ink:   #16201B;
  --clay:  #4E5A52;   /* stage tags, quiet labels */
  --fade:  #515D55;
  /* bottle green for the structure, copper for anything the learner earned */
  --a1: #1D4D3B;  --a1-rgb: 29,77,59;
  --a2: #9E5320;  --a2-rgb: 158,83,32;
  --serif: Georgia, 'Times New Roman', serif;
  --sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --mono: ui-monospace, 'Cascadia Code', Consolas, 'Courier New', monospace;
}

/* 1. Ground: stone laid in courses. Linear like the family, horizontal at a
      much wider pitch than Depot's, and paired with a hairline so the course
      reads as a joint rather than as a ruled line. */
body {
  font-family: var(--serif) !important;
  background-image:
    repeating-linear-gradient(0deg,
      transparent 0 63px,
      rgba(22,32,27,0.055) 63px 64px,
      rgba(255,255,255,0.55) 64px 65px,
      transparent 65px 66px) !important;
}
h1, h2, h3 {
  font-family: var(--sans) !important;
  font-weight: 600 !important;
  letter-spacing: -0.006em !important;
}

/* 2. Cards: square, hairline, one accent at the head, incised rather than
      applied. The dark line and the light line under it are the whole move. */
.card, .source, .stat-wrap, .carousel, .kt {
  border-radius: 0 !important;
  border: 1px solid rgba(29,77,59,0.24) !important;
  box-shadow: none !important;
}
.card, .stat-wrap, .carousel {
  border-top: 3px solid var(--a1) !important;
  box-shadow: inset 0 3px 0 0 rgba(255,255,255,0.75) !important;
}

/* 3. Labels: filled slate plates, uppercase, tracked wide like a cut caption. */
.stage-tag, .kt-label, .expl-label, .pop-label {
  font-family: var(--sans) !important;
  font-weight: 600 !important;
  font-size: 0.63rem !important;
  letter-spacing: 0.15em !important;
  text-transform: uppercase !important;
  background: var(--a1) !important;
  color: var(--sand) !important;
  border-radius: 0 !important;
  padding: 0.26rem 0.66rem !important;
  display: inline-block;
}
.cover-eyebrow, .results-eyebrow, .top-meta {
  font-family: var(--sans) !important;
  color: var(--clay) !important;
  letter-spacing: 0.11em !important;
}
.marks {
  font-family: var(--sans) !important;
  font-weight: 600 !important;
  letter-spacing: 0.04em !important;
  color: var(--a2) !important;
}

/* 4. A source is recessed: sunk panel, chiselled left edge, edges intact. */
.source {
  background: var(--cut) !important;
  border: 1px solid rgba(29,77,59,0.32) !important;
  border-left: 6px solid var(--a1) !important;
  border-radius: 0 !important;
  padding: 1.2rem 1.25rem !important;
  box-shadow: inset 2px 2px 5px rgba(22,32,27,0.11) !important;
}
.source, .source p, .source li { font-family: var(--serif) !important; }
.source-attr {
  font-family: var(--sans) !important;
  font-size: 0.7rem !important;
  font-weight: 600 !important;
  line-height: 1.45 !important;
  text-transform: none !important;
  color: var(--ink) !important;
  background: transparent;
  border-bottom: 1px solid rgba(29,77,59,0.38);
  border-radius: 0;
  padding: 0 0 0.6rem 0;
  margin-bottom: 0.92rem;
}
.toggle-btn {
  font-family: var(--sans) !important;
  border-radius: 0 !important;
  border: 1px solid var(--a1) !important;
  color: var(--a1) !important;
  letter-spacing: 0.03em !important;
}

/* 5. Cover flourish: a cut course, deep line over highlight, at full width. */
.header-block::before, .cover-arc, .cover-fan { display: none !important; }
.rule, .cover-rule, .flourish, .story-rule {
  width: 188px !important;
  height: 6px !important;
  border-radius: 0 !important;
  background-color: transparent !important;
  background-image:
    linear-gradient(180deg,
      var(--a1) 0 3px,
      rgba(255,255,255,0.8) 3px 5px,
      transparent 5px 6px) !important;
  background-repeat: no-repeat !important;
}

/* The engine reveals the three cover lines as inline spans on a stagger, which
   runs them together as one filling paragraph. Each span gets its own line so
   they arrive one at a time. The engine is untouched: only display changes. */
.cover-line {
  font-style: normal !important;
  color: var(--clay) !important;
  min-height: 9rem;
  max-width: 32rem;
}
.cover-line span {
  display: block;
  margin-bottom: 0.85rem;
  transition: opacity 0.55s ease, transform 0.55s ease !important;
  transform: translateY(5px);
}
.cover-line span.vis { transform: translateY(0); }
.cover-line span:last-child { color: var(--ink); font-weight: 600; }
@media (max-width: 520px) { .cover-line { min-height: 12rem; } }

.cover-title, .q-text, .story-line, .story-num { font-family: var(--sans) !important; }
.chip {
  border-radius: 0 !important;
  font-family: var(--sans) !important;
  font-size: 0.62rem !important;
  letter-spacing: 0.08em !important;
}

/* 6. Buttons */
.btn-begin {
  background: var(--a1) !important;
  color: var(--sand) !important;
  border: 2px solid var(--a1) !important;
  border-radius: 0 !important;
  font-family: var(--sans) !important;
  font-weight: 600 !important;
}
.btn-begin:hover { background: #133728 !important; border-color: #133728 !important; }
.primary-btn, .secondary-btn, .section-btn, .primary-btn-small {
  border-radius: 0 !important;
  font-family: var(--sans) !important;
}

.stat-num {
  color: var(--a1) !important;
  font-family: var(--sans) !important;
  font-weight: 700 !important;
}
.stat-label { color: var(--clay) !important; font-family: var(--sans) !important; }

/* Figures. Caption reads left at a measure that holds on a phone. */
.figure figcaption {
  text-align: left !important;
  max-width: 34rem;
  margin-left: auto; margin-right: auto;
  font-family: var(--sans) !important;
  font-size: 0.82rem !important;
  color: var(--clay) !important;
  border-top: 2px solid var(--a1);
  padding-top: 0.6rem;
}
.figure img, .figure svg {
  border: 1px solid rgba(29,77,59,0.42) !important;
  border-radius: 0 !important;
}
/* Original illustrations are inline SVG so they inherit the thirteen tokens and
   invert with the rest of the page. They need the same box the photographs get. */
.figure svg {
  display: block;
  width: 100%;
  max-width: 460px;
  height: auto;
  margin: 0 auto;
  background: var(--paper);
  font-family: var(--sans);
}
.figure svg text { fill: var(--ink); }

/* ---- DARK MODE ------------------------------------------------------------
   The same thirteen, and the two engine rules the token re-point cannot rescue.
   engine/tokens.css re-points every DERIVED token, so the legacy state-colour
   patch block is redundant for options, chips and explanations. It cannot help
   where the engine uses --ink or --sand directly as a BACKGROUND, because those
   two are meant to flip. Audited: .primary-btn and .chip-apply are the two that
   invert into a light slab on a dark page.

   --fade is chosen to clear 7 to 1 against --paper, because it is what --muted
   inherits and --muted is every expander body. Measured at 8.6 against --paper and 7.4 against --cut, which is the
   ground it actually sits on inside a source expander. */
body.alt {
  --sand:  #101613;
  --paper: #1A221E;
  --cut:   #242D28;
  --ink:   #E7EDE9;
  --clay:  #9FAEA6;
  --fade:  #B6C4BC;
  --a1: #6FBF9C;  --a1-rgb: 111,191,156;
  --a2: #E8A263;  --a2-rgb: 232,162,99;
}
body.alt {
  background-image:
    repeating-linear-gradient(0deg,
      transparent 0 63px,
      rgba(0,0,0,0.35) 63px 64px,
      rgba(231,237,233,0.07) 64px 65px,
      transparent 65px 66px) !important;
}
body.alt .card, body.alt .source, body.alt .stat-wrap,
body.alt .carousel, body.alt .kt { border-color: rgba(111,191,156,0.28) !important; }
body.alt .card, body.alt .stat-wrap, body.alt .carousel {
  box-shadow: inset 0 3px 0 0 rgba(0,0,0,0.45) !important;
}
body.alt .source {
  border-left-color: var(--a1) !important;
  box-shadow: inset 2px 2px 5px rgba(0,0,0,0.40) !important;
}
body.alt .source-attr { border-bottom-color: rgba(111,191,156,0.36); }
body.alt .stage-tag, body.alt .kt-label,
body.alt .expl-label, body.alt .pop-label { color: #101613 !important; }
body.alt .btn-begin { color: #101613 !important; }
body.alt .btn-begin:hover { background: #8CD0B2 !important; border-color: #8CD0B2 !important; }
body.alt .rule, body.alt .cover-rule, body.alt .flourish, body.alt .story-rule {
  background-image:
    linear-gradient(180deg,
      var(--a1) 0 3px,
      rgba(0,0,0,0.5) 3px 5px,
      transparent 5px 6px) !important;
}
body.alt .figure img { filter: brightness(0.9) contrast(1.02); }
body.alt .figure img, body.alt .figure svg { border-color: rgba(111,191,156,0.44) !important; }

body.alt .primary-btn {
  background: var(--cut) !important;
  color: var(--ink) !important;
  border: 1px solid rgba(111,191,156,0.38) !important;
}
body.alt .primary-btn:hover { background: #2C3730 !important; }
body.alt .primary-btn .btn-title { color: var(--ink) !important; }
body.alt .primary-btn .btn-sub   { color: var(--fade) !important; }
body.alt .primary-btn .btn-num,
body.alt .primary-btn .btn-arrow { color: var(--a1) !important; }
body.alt .chip-apply {
  background: rgba(231,237,233,0.16) !important;
  color: var(--ink) !important;
}
/* Light serif at 0.95rem thins out on a dark ground, and the explanation block
   is the longest reading on any screen. */
body.alt .expl-text, body.alt .disc-body { color: var(--ink) !important; }
body.alt .expl-text { font-size: 1rem !important; line-height: 1.75 !important; }

/* The toggle is fixed bottom right and lands on Continue on a short viewport.
   Kept above the 44px tap minimum at 360px. */
.mode-toggle {
  bottom: 1rem; right: 1rem;
  border-radius: 0 !important;
  font-family: var(--sans) !important;
  min-height: 44px;
  min-width: 44px;
}
body { padding-bottom: 4.5rem !important; }
@media (max-width: 520px) {
  .mode-toggle { bottom: 0.7rem; right: 0.7rem; padding: 0.5rem 0.7rem; font-size: 0.62rem; }
}
@media (max-width: 380px) {
  .top-meta { min-width: 0; }
  .source { padding: 1rem 0.95rem !important; }
}

* { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background:
      repeating-linear-gradient(90deg, rgba(var(--a1-rgb),0.05) 0 1px, transparent 1px 5px),
      radial-gradient(ellipse at top right, rgba(var(--a1-rgb),0.10) 0%, transparent 58%),
      radial-gradient(ellipse at bottom left, rgba(var(--a2-rgb),0.09) 0%, transparent 58%),

    font-family: var(--serif);
    color: var(--ink); line-height: 1.6; -webkit-text-size-adjust: 100%;

  }
  .container { max-width: 720px; margin: 0 auto; }
  .top-bar { margin-bottom: 1.6rem; }
  .top-meta { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--sans); font-size: 0.68rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--a2); font-weight: 700; margin-bottom: 0.55rem; gap: 0.7rem; flex-wrap: nowrap; }
  /* Flex children default to min-width auto, so at 360px the eyebrow and the
     step counter used to overlap. The eyebrow takes the free space and
     truncates instead of pushing the counter off the row. */
  .top-meta > * { min-width: 0; }
  .top-meta #lesson-tag, .top-meta .top-label { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .top-meta .top-count { flex: 0 0 auto; white-space: nowrap; }
  @media (max-width: 380px) { .top-meta { font-size: 0.62rem; letter-spacing: 0.09em; } }

  .cover-title { font-size: clamp(2.3rem,7vw,3.6rem); font-weight: 800; line-height: 1.03; letter-spacing: -0.025em; margin-bottom: 1.3rem; }

      radial-gradient(circle at 9px 4.5px, var(--a1) 0 4px, transparent 4.5px),

    "html": "<h2>The word for what you just did</h2><p>You did not ask whether the list was accurate. You asked who wrote it, and what they counted as taking part.</p><p>That is <strong>perspective</strong>: the position a person or body is speaking from, and what that position makes visible or invisible to them. It is not the same as bias, which is a judgement about fairness. Perspective is a fact about where somebody stands.</p><p>Paper 2 uses it constantly. <em>Explain the perspective of the writer. Comment on the usefulness of the source.</em> Both want the same first move, which is to work out who is talking and what they can see from there.</p>",

    "tag": "The evidence",
    "html": "<h2>Three parties, three objections</h2><p>The <strong>National Party</strong> said the commission had gone looking for revenge rather than reconciliation. De Klerk took legal action to keep a paragraph about him out of the published report.</p><p>The <strong>African National Congress</strong> said it was wrong to judge the violence used to fight apartheid by the same standard as the violence used to defend it. Mbeki argued the point, and the ANC went to court to stop publication. It failed, and the report came out.</p><p>The <strong>Inkatha Freedom Front</strong> said the commission had favoured the ANC's version of the 1980s and played down the violence in Natal. Buthelezi was never subpoenaed, which the commission decided in order to avoid restarting the fighting.</p>",
    "remember": "Everyone objected, and no two objected to the same thing. That is the pattern worth carrying into any question about the responses.",
    "terms": [
      {
        "term": "Subpoena",
        "def": "A legal order to appear and give evidence. The commission had the power and did not always use it."
      }
    ]

    "sourceLabel": "Source 4A",
    "html": "<h2>The chairperson's foreword to the report, 1998</h2><p>Tutu opens the first volume by saying what the commission set out to do, and closes by asking something of the reader.</p><p><strong>First pass:</strong> whose perspectives does he say the report reflects?</p><p><strong>Second pass:</strong> notice who he addresses directly, and what he says he has been saddened by.</p>",
    "source": {
      "attr": "Source 4A: from the Foreword by the Chairperson, Truth and Reconciliation Commission of South Africa Report, Volume One, presented to President Nelson Mandela on 29 October 1998.",
      "body": "<p>In its report, therefore, the Commission seeks to reflect fairly and fully the motives and perspectives of both the alleged perpetrators of gross human rights violations and of their victims.</p><p>I want to make a heartfelt plea to my white fellow South Africans. On the whole we have been exhilarated by the magnanimity [generosity of spirit] of those who should by rights be consumed by bitterness and a lust for revenge; who instead have time after time shown an astonishing magnanimity and willingness to forgive.</p><p>Nevertheless, the bulk of victims have been black and I have been saddened by what has appeared to be a mean-spiritedness in some of the leadership in the white community.</p><p>The Commission has done its share to promote national unity and reconciliation. Their achievement is up to each one of us.</p>",
      "toggle": "Three things are happening here at once. The first paragraph is the commission defending its method before anyone attacks it: both perpetrators and victims, fairly and fully. That sentence is the answer to every objection that followed, and it was written before the objections arrived. The second and third are not a commission speaking, they are an archbishop. A heartfelt plea to my white fellow South Africans is a sermon inside an official report, and the word saddened is doing the work that a finding cannot. Then look at the last line. The commission has done its share, and the achievement is up to each one of us. He is handing the job to the reader and telling you that publication was not the end of anything.",
      "toggleLabel": "What does this actually mean?"
    },
    "terms": [
      {
        "term": "Foreword",
        "def": "An opening statement by the author or chair. It says what a document was for, in a voice the rest of the document does not use."
      },
      {
        "term": "Magnanimity",
        "def": "Generosity towards someone who has wronged you. Tutu uses it about victims who chose not to seek revenge."
      }
    ]

    "html": "<h2>The walls that came afterwards</h2><figure class=\"figure wide\"><svg role=\"img\" aria-label=\"A horizontal bar showing the capacity of the Wall of Names. The full bar stands for 120 000 name spaces. About five eighths of it is filled to show the 75 000 names verified so far, and the rest is left open.\" viewBox=\"0 0 460 210\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"1\" y=\"14\" font-size=\"11.5\" text-anchor=\"start\" fill=\"var(--clay)\" font-weight=\"400\">The Wall of Names, by capacity</text><text x=\"457\" y=\"14\" font-size=\"11.5\" text-anchor=\"end\" fill=\"var(--clay)\" font-weight=\"400\">697 metres of stone</text><rect x=\"1\" y=\"28\" width=\"286\" height=\"46\" fill=\"var(--a1)\"/><rect x=\"288\" y=\"28\" width=\"170\" height=\"46\" fill=\"none\" stroke=\"var(--clay)\" stroke-width=\"1\" stroke-dasharray=\"4 4\"/><text x=\"8\" y=\"57\" font-size=\"12\" text-anchor=\"start\" fill=\"var(--sand)\" font-weight=\"700\">75 000 verified</text><text x=\"450\" y=\"57\" font-size=\"11.5\" text-anchor=\"end\" fill=\"var(--clay)\" font-weight=\"600\">space for 120 000</text><line x1=\"1\" y1=\"96\" x2=\"457\" y2=\"96\" stroke=\"var(--a1)\" stroke-width=\"1\"/><text x=\"1\" y=\"120\" font-size=\"12\" text-anchor=\"start\" fill=\"var(--ink)\" font-weight=\"700\">Eight conflicts are commemorated</text><text x=\"1\" y=\"140\" font-size=\"10.5\" text-anchor=\"start\" fill=\"var(--clay)\" font-weight=\"400\">• Pre-colonial wars</text><text x=\"235\" y=\"140\" font-size=\"10.5\" text-anchor=\"start\" fill=\"var(--clay)\" font-weight=\"400\">• Slavery</text><text x=\"1\" y=\"156\" font-size=\"10.5\" text-anchor=\"start\" fill=\"var(--clay)\" font-weight=\"400\">• Genocide</text><text x=\"235\" y=\"156\" font-size=\"10.5\" text-anchor=\"start\" fill=\"var(--clay)\" font-weight=\"400\">• Wars of Resistance</text><text x=\"1\" y=\"172\" font-size=\"10.5\" text-anchor=\"start\" fill=\"var(--clay)\" font-weight=\"400\">• The South African War</text><text x=\"235\" y=\"172\" font-size=\"10.5\" text-anchor=\"start\" fill=\"var(--clay)\" font-weight=\"400\">• The First World War</text><text x=\"1\" y=\"188\" font-size=\"10.5\" text-anchor=\"start\" fill=\"var(--clay)\" font-weight=\"400\">• The Second World War</text><text x=\"235\" y=\"188\" font-size=\"10.5\" text-anchor=\"start\" fill=\"var(--clay)\" font-weight=\"400\">• The Struggle for Liberation</text><line x1=\"1\" y1=\"196\" x2=\"457\" y2=\"196\" stroke=\"var(--clay)\" stroke-width=\"0.8\"/><text x=\"1\" y=\"208\" font-size=\"10.5\" text-anchor=\"start\" fill=\"var(--ink)\" font-weight=\"600\">Members of the South African Defence Force are not included.</text></svg><figcaption>The Wall of Names at Freedom Park, opened from 2005, drawn as a count. It commemorates people who died in eight conflicts, from the pre-colonial wars to the struggle for liberation. The dates matter because the wall was designed to hold far more names than have been verified, so it is a memorial built to keep growing. Original illustration for Kula Revise, from the park's published figures.</figcaption></figure><p>Freedom Park's wall runs 697 metres and can hold 120 000 names. About 75 000 have been verified for inscription.</p><p>Those who fought in the South African Defence Force for the apartheid government were not included, on the grounds that they had not fought for freedom. A memorial built to unite the country still had to decide who counted.</p><p>Thokoza went the other way. More than six hundred people died there in fighting between hostel dwellers and township residents. The community built a roll of honour naming everyone killed, from both sides. Thabo Mbeki and Mangosuthu Buthelezi unveiled it together in 1999, on Khumalo Street, the old boundary between them.</p>",

const CHIP = {
  Argue:{cls:"chip-argue"}, Evidence:{cls:"chip-evidence"}, Weigh:{cls:"chip-weigh"},
  Extract:{cls:"chip-extract"}, Interpret:{cls:"chip-interpret"}, Evaluate:{cls:"chip-evaluate"},
  instinct:{cls:"chip-instinct"}
};
// A lesson carries one spine or the other. Work it out on first use rather than at
// load time, so this never depends on FLOW having been evaluated yet.
const SOURCE_SPINE = ["Extract","Interpret","Evaluate"];
const ESSAY_SPINE  = ["Argue","Evidence","Weigh"];
let _spine = null;
function spine(){
  if(_spine) return _spine;
  const flow = (typeof FLOW !== "undefined" && Array.isArray(FLOW)) ? FLOW : [];
  _spine = flow.some(s => s && SOURCE_SPINE.includes(s.level)) ? SOURCE_SPINE : ESSAY_SPINE;
  return _spine;
}
// Never let an unknown label throw: an unrecognised spine word degrades to the neutral chip.
const chipCls = lvl => (CHIP[lvl] || CHIP.instinct).cls;

const stage = document.getElementById("stage");
const nav = document.getElementById("nav");
const topBar = document.getElementById("top-bar");
const nextBtn = document.getElementById("next-btn");
const backBtn = document.getElementById("back-btn");

const state = {
  idx: -1,                 // -1 = cover
  answers: {},             // qIdx -> chosen content index (mcq) or serialized (interactive)
  revealed: {},            // qIdx -> bool
  order: {},               // qIdx -> shuffled content-index array
  carRead: {},             // stepIdx -> Set of read card indices
  interState: {},          // qIdx -> working state for order/sort
  poppedBuild: {},         // qIdx -> bool (running-summary popup already shown)
};

const buildIds = FLOW.map((f,i)=>f.build?i:null).filter(i=>i!==null);
const assessedIds = FLOW.map((f,i)=>(f.type==="question"&&f.level)?i:null).filter(i=>i!==null);

function esc(s){
  return String(s).replace(/[&<>"]/g, (c, i, str) => {
    if(c === "&"){
      // leave a real HTML entity intact (e.g. &middot; &amp; &#8635;)
      const rest = str.slice(i);
      if(/^&(#\d+|#x[0-9a-fA-F]+|[a-zA-Z]+);/.test(rest)) return "&";
    }
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
  });
}

// {optN} -> the letter option N carries after shuffle
function resolveOpts(text, order){
  if(!text) return text;
  return text.replace(/\{opt(\d+)\}/g,(m,n)=>{
    const p = order ? order.indexOf(parseInt(n,10)) : -1;
    return p>=0 ? String.fromCharCode(65+p) : m;
  });
}

// ============ COVER ============
function renderCover(){
  topBar.classList.add("hidden");
  nav.classList.add("hidden");
  const lines = (COVER.lines||[]).map(l=>`<span>${esc(l)} </span>`).join("");
  stage.innerHTML = `
    <div class="cover">
      <div class="cover-eyebrow">${COVER.eyebrow||""}</div>
      <h1 class="cover-title">${esc(COVER.title||"")}</h1>
      <div class="flourish"></div>
      <div class="cover-line" id="cover-line">${lines}</div>
      <button class="btn-begin" id="begin-btn">${COVER.begin||"Begin"} <span class="sa">&rarr;</span></button>
      ${COVER.time?`<div class="cover-time">${esc(COVER.time)}</div>`:""}
      ${COVER.skip!==false?`<button class="skip-link" id="skip-btn">Skip the opening if you have done this lesson before</button>`:""}
    </div>`;
  const spans = [...document.querySelectorAll("#cover-line span")];
  spans.forEach((s,i)=>setTimeout(()=>s.classList.add("vis"), 350*(i+1)));
  document.getElementById("begin-btn").addEventListener("click",()=>{ state.idx=0; render(); });
  const skip = document.getElementById("skip-btn");
  if(skip) skip.addEventListener("click",()=>{ state.idx = firstContentIdx(); render(); });
}
function firstContentIdx(){
  const i = FLOW.findIndex(f=>f.type==="content"||f.type==="carousel"||f.type==="stat");
  return i<0?0:i;
}

// ============ STORY HOOK ============
function renderStory(item){
  const lines = item.lines.map((l,i)=>{
    const last = i===item.lines.length-1 ? " last" : "";
    return `<div class="story-line${last}">${esc(l)}</div>`;
  }).join("");
  stage.innerHTML = `
    <div class="story">
      <div class="story-num">${esc(item.marker)}</div>
      <div class="story-unit">${esc(item.markerLabel||"")}</div>
      <div class="story-rule"></div>
      ${lines}
    </div>`;
  const els = [...stage.querySelectorAll(".story-line")];
  nextBtn.disabled = true;
  els.forEach((el,i)=>setTimeout(()=>{
    el.classList.add("vis");
    if(i===els.length-1) nextBtn.disabled = false;
  }, 650*(i+1)));
}

// ============ STATIC CONTENT ============
// Key-terms strip: label + one expandable chip per term.
function ktStrip(terms){
  if(!terms || !terms.length) return "";
  const chips = terms.map(t=>`<details class="kt-term"><summary>${esc(t.term)}</summary><div class="kt-def">${esc(t.def)}</div></details>`).join("");
  return `<div class="kt"><div class="kt-label">Key terms &middot; tap to open</div><div class="kt-row">${chips}</div></div>`;
}
function rememberBox(text){
  if(!text) return "";
  return `<details class="remember"><summary>Remember it like this</summary><div class="disc-body">${text}</div></details>`;
}

function renderContent(item){
  stage.innerHTML = `<div class="card">${item.tag?`<div class="stage-tag">${esc(item.tag)}</div>`:""}${item.html}${rememberBox(item.remember)}${ktStrip(item.terms)}</div>`;
  bindToggles();
}

// ============ CAROUSEL ============
function renderCarousel(item){
  const cards = item.cards;
  if(!state.carRead[state.idx]) state.carRead[state.idx] = new Set([0]);
  const read = state.carRead[state.idx];
  const pos = state.interState[state.idx]?.pos || 0;
  read.add(pos);
  const c = cards[pos];
  const body = typeof c==="string" ? c : `<span class="cc-lead">${esc(c.lead)}</span>${esc(c.body)}`;
  const dots = cards.map((_,i)=>`<span class="car-dot ${read.has(i)?"read":""} ${i===pos?"here":""}"></span>`).join("");
  const allRead = read.size===cards.length;
  stage.innerHTML = `
    <div class="card">
      ${item.tag?`<div class="stage-tag">${esc(item.tag)}</div>`:""}
      ${item.heading?`<h2>${esc(item.heading)}</h2>`:""}
      <div class="car-wrap">
        <div class="car-prompt" id="car-prompt">${allRead?`That is all ${cards.length}. Continue is unlocked.`:`Tap the arrows to read all ${cards.length}. Continue unlocks when you have.`}</div>
        <div class="car-frame"><div class="car-card">${body}</div></div>
        <div class="car-nav">
          <div class="car-dots">${dots}</div>
          <div class="car-count">${pos+1} / ${cards.length}</div>
          <div class="car-btns">
            <button class="car-btn" id="car-prev" ${pos===0?"disabled":""}>&larr;</button>
            <button class="car-btn" id="car-next" ${pos===cards.length-1?"disabled":""}>&rarr;</button>
          </div>
        </div>
      </div>
      ${ktStrip(item.terms)}
    </div>`;
  nextBtn.disabled = !allRead;
  const setPos=(p)=>{ state.interState[state.idx]={pos:p}; renderCarousel(item); };
  const pv=document.getElementById("car-prev"), nx=document.getElementById("car-next");
  if(pv) pv.addEventListener("click",()=>setPos(Math.max(0,pos-1)));
  if(nx) nx.addEventListener("click",()=>setPos(Math.min(cards.length-1,pos+1)));
}

// ============ STAT STRIP ============
function renderStat(item){
  const stats = item.stats.map(s=>`<div class="stat"><div class="stat-num">${esc(s.num)}</div><div class="stat-label">${esc(s.label)}</div></div>`).join("");
  stage.innerHTML = `
    <div class="card">
      ${item.tag?`<div class="stage-tag">${esc(item.tag)}</div>`:""}
      ${item.heading?`<h2>${esc(item.heading)}</h2>`:""}
      ${item.lead?`<p>${item.lead}</p>`:""}
      <div class="stat-strip">${stats}</div>
      ${ktStrip(item.terms)}
    </div>`;
}


// Reopen strip: shown on a question that follows a source, so the learner
// never has to tap Back to reread the extract.
//
// v2.1. Was: the strip offered LAST_SOURCE only. That is correct for a lesson
// built on one source and wrong for a capstone, where the paragraph question
// asks for all of them and a learner on the closing screens could reach only
// the most recent. Now every source seen so far in the file is reachable: a row
// of tabs, and a swipeable track underneath. One source renders exactly as
// before, so nothing in the existing corpus changes.
function sourcePeek(item){
  if(item.noSource) return "";
  if(item.sourceRef && item.sourceRef.body){
    return peekShell([item.sourceRef]);
  }
  const seen = SOURCES_SEEN.filter(s => s && s.body);
  if(!seen.length) return "";
  return peekShell(seen);
}

function peekShell(list){
  const many = list.length > 1;
  const cue = many
    ? `Tap to read the ${list.length} sources again`
    : `Tap to read ${esc(list[0].label)} again`;
  const who = many
    ? list.map(s=>esc(s.label)).join(" &middot; ")
    : esc(stripTags(list[0].attr)).slice(0,90);
  const tabs = many
    ? `<div class="peek-tabs" role="tablist">${list.map((s,i)=>
        `<button class="peek-tab${i===list.length-1?" on":""}" data-peek="${i}" role="tab">${esc(s.label)}</button>`).join("")}</div>`
    : "";
  const track = `<div class="peek-track" data-peek-track>${list.map(s=>
      `<div class="peek-slide"><div class="peek-attr">${s.attr}</div>${s.body}</div>`).join("")}</div>`;
  return `<details class="srcpeek${many?" multi":""}"><summary>
      <svg class="chev" width="11" height="13" viewBox="0 0 11 13" fill="none" aria-hidden="true"><path d="M2 1.5 L8.5 6.5 L2 11.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="peek-cue">${cue}<span class="peek-who">${who}</span></span>
    </summary><div class="peek-body">${tabs}${track}</div></details>`;
}

// Tabs scroll the track; swiping the track updates the tabs. Both work alone,
// so a learner who never notices the tabs can still swipe, and the other way round.
function bindPeek(){
  stage.querySelectorAll(".srcpeek.multi").forEach(d=>{
    const track = d.querySelector("[data-peek-track]");
    const tabs  = Array.from(d.querySelectorAll(".peek-tab"));
    if(!track || !tabs.length) return;
    const go = i => track.scrollTo({ left: i * track.clientWidth, behavior: "smooth" });
    tabs.forEach(t => t.addEventListener("click", () => go(parseInt(t.dataset.peek,10))));
    let tick = null;
    track.addEventListener("scroll", () => {
      clearTimeout(tick);
      tick = setTimeout(() => {
        const i = Math.round(track.scrollLeft / Math.max(1, track.clientWidth));
        tabs.forEach((t,n) => t.classList.toggle("on", n === i));
      }, 60);
    });
    // open on the source the learner saw last, which is the one they were reading
    d.addEventListener("toggle", () => {
      if(d.open) requestAnimationFrame(() => { track.scrollLeft = (tabs.length-1) * track.clientWidth; });
    });
  });
}
function stripTags(h){ return String(h||"").replace(/<[^>]+>/g,""); }

// ============ SOURCE ============
// Every source rendered so far, in order, so any later question can reopen all
// of them. LAST_SOURCE is kept as the final entry for anything still reading it.
let SOURCES_SEEN = [];
let LAST_SOURCE = null;

function renderSource(item){
  const s=item.source;
  LAST_SOURCE = { label: item.sourceLabel || item.tag || "the source", attr: s.attr, body: s.body };
  if(!SOURCES_SEEN.some(x => x.label === LAST_SOURCE.label)) SOURCES_SEEN.push(LAST_SOURCE);
  stage.innerHTML = `
    <div class="card">
      ${item.tag?`<div class="stage-tag">${esc(item.tag)}</div>`:""}
      ${item.html||""}
      <div class="source">
        <div class="source-attr">${s.attr}</div>
        <div class="source-body">${s.body}</div>
        ${s.toggle?`<button class="toggle-btn" data-toggle>${s.toggleLabel||"What does this actually mean?"}</button><div class="toggle-body">${s.toggle}</div>`:""}
      </div>
      ${ktStrip(item.terms)}
    </div>`;
  bindToggles();
}

// ============ QUESTION (mcq / order / sort) ============
function renderQuestion(item){
  if(item.mode==="order") return renderOrder(item);
  if(item.mode==="sort") return renderSort(item);
  return renderMCQ(item);
}

function renderMCQ(item){
  const answered = state.revealed[state.idx];
  if(!state.order[state.idx]){
    const a=item.options.map((_,i)=>i);
    for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
    state.order[state.idx]=a;
  }
  const order=state.order[state.idx];
  const chip = item.level ? `<span class="chip ${chipCls(item.level)}">${item.level}</span>` : `<span class="chip chip-instinct">Instinct</span>`;
  let opts="";
  order.forEach((orig,pos)=>{
    let cls="option", mark="";
    if(answered){
      if(orig===item.correct){ cls+=" correct"; mark=`<span class="opt-mark">&#10003;</span>`; }
      else if(orig===state.answers[state.idx]){ cls+=" wrong"; mark=`<span class="opt-mark">&#10007;</span>`; }
      else cls+=" dimmed";
    } else if(state.answers[state.idx]===orig){ cls+=" selected"; }
    opts+=`<button class="${cls}" data-orig="${orig}" ${answered?"disabled":""}><span class="opt-letter">${String.fromCharCode(65+pos)}</span><span class="opt-text">${item.options[orig]}</span>${mark}</button>`;
  });
  stage.innerHTML = `
    <div class="card">
      <div class="q-meta">${chip}${item.marks?`<span class="marks">${esc(item.marks)}</span>`:""}</div>
      ${sourcePeek(item)}
      <div class="q-text">${item.q}</div>
      <div class="options">${opts}</div>
      ${answered?`<div class="explanation"><div class="expl-label">Why</div><div class="expl-text">${resolveOpts(item.explanation, order)}</div></div>`:""}
    </div>`;
  if(!answered){
    stage.querySelectorAll(".option").forEach(b=>b.addEventListener("click",()=>{
      state.answers[state.idx]=parseInt(b.dataset.orig,10);
      state.revealed[state.idx]=true;
      render();
    }));
  }
  syncNav(true);
}

// order: tap to place into a numbered list, tap placed to remove; Check when all placed
function renderOrder(item){
  const answered = state.revealed[state.idx];
  const st = state.interState[state.idx] || (state.interState[state.idx]={placed:[]});
  const placed = st.placed;                       // array of content indices in chosen order
  const remaining = item.items.map((_,i)=>i).filter(i=>!placed.includes(i));
  let placedHtml = placed.map((ci,pos)=>{
    let cls="inter-item inter-placed";
    if(answered){ cls = "inter-item "+(ci===item.answer[pos]?"ok":"no"); }
    return `<button class="${cls}" data-placed="${ci}" ${answered?"disabled":""}><span class="rank">${pos+1}</span><span>${esc(item.items[ci])}</span></button>`;
  }).join("");
  let poolHtml = remaining.map(ci=>`<button class="inter-item" data-pool="${ci}"><span class="rank">&bull;</span><span>${esc(item.items[ci])}</span></button>`).join("");
  stage.innerHTML = `
    <div class="card">
      <div class="q-meta"><span class="chip ${item.level?chipCls(item.level):"chip-instinct"}">${item.level||"Instinct"}</span>${item.marks?`<span class="marks">${esc(item.marks)}</span>`:""}</div>
      ${sourcePeek(item)}
      <div class="q-text">${item.q}</div>
      <div class="inter">
        <div class="inter-pool" id="placed">${placedHtml||`<div style="color:var(--fade);font-size:0.9rem;padding:0.4rem 0;">Tap an event below to start putting them in order.</div>`}</div>
        ${remaining.length?`<div style="height:1px;background:rgba(27,42,51,0.14);margin:0.9rem 0;"></div><div class="inter-pool" id="pool">${poolHtml}</div>`:""}
      </div>
      ${answered?`<div class="explanation"><div class="expl-label">Why</div><div class="expl-text">${resolveOpts(item.explanation,null)}</div></div>`:""}
    </div>`;
  if(!answered){
    stage.querySelectorAll("[data-pool]").forEach(b=>b.addEventListener("click",()=>{ placed.push(parseInt(b.dataset.pool,10)); renderOrder(item); }));
    stage.querySelectorAll("[data-placed]").forEach(b=>b.addEventListener("click",()=>{ const ci=parseInt(b.dataset.placed,10); st.placed=placed.filter(x=>x!==ci); renderOrder(item); }));
  }
  const allPlaced = placed.length===item.items.length;
  syncNavInteractive(allPlaced, answered, ()=>{
    state.answers[state.idx]=placed.slice();
    state.revealed[state.idx]=true; render();
  });
}

// sort: two columns, tap an item's column button to place, tap placed to remove
function renderSort(item){
  const answered = state.revealed[state.idx];
  const st = state.interState[state.idx] || (state.interState[state.idx]={col:{}});
  const col = st.col;                              // content index -> 0/1
  const unplaced = item.items.map((_,i)=>i).filter(i=>!(i in col));
  const colCards = (which)=>item.items.map((it,ci)=>{
    if(col[ci]!==which) return "";
    let cls="inter-item inter-placed";
    if(answered) cls="inter-item "+(item.answer[ci]===which?"ok":"no");
    return `<button class="${cls}" data-un="${ci}" ${answered?"disabled":""}><span>${esc(it)}</span></button>`;
  }).join("");
  const pool = unplaced.map(ci=>`
    <div class="inter-item" style="flex-direction:column;align-items:stretch;cursor:default;">
      <span>${esc(item.items[ci])}</span>
      <div class="sort-btns">
        <button class="sort-place" data-place="${ci}" data-col="0">${esc(item.cols[0])}</button>
        <button class="sort-place" data-place="${ci}" data-col="1">${esc(item.cols[1])}</button>
      </div>
    </div>`).join("");
  stage.innerHTML = `
    <div class="card">
      <div class="q-meta"><span class="chip ${item.level?chipCls(item.level):"chip-instinct"}">${item.level||"Instinct"}</span>${item.marks?`<span class="marks">${esc(item.marks)}</span>`:""}</div>
      ${sourcePeek(item)}
      <div class="q-text">${item.q}</div>
      <div class="inter">
        <div class="sort-cols">
          <div class="sort-col"><h4>${esc(item.cols[0])}</h4>${colCards(0)}</div>
          <div class="sort-col"><h4>${esc(item.cols[1])}</h4>${colCards(1)}</div>
        </div>
        ${unplaced.length?`<div style="height:1px;background:rgba(27,42,51,0.14);margin:0.9rem 0;"></div><div class="inter-pool">${pool}</div>`:""}
      </div>
      ${answered?`<div class="explanation"><div class="expl-label">Why</div><div class="expl-text">${resolveOpts(item.explanation,null)}</div></div>`:""}
    </div>`;
  if(!answered){
    stage.querySelectorAll("[data-place]").forEach(b=>b.addEventListener("click",()=>{ col[parseInt(b.dataset.place,10)]=parseInt(b.dataset.col,10); renderSort(item); }));
    stage.querySelectorAll("[data-un]").forEach(b=>b.addEventListener("click",()=>{ delete col[parseInt(b.dataset.un,10)]; renderSort(item); }));
  }
  const allPlaced = unplaced.length===0;
  syncNavInteractive(allPlaced, answered, ()=>{
    state.answers[state.idx]=Object.assign({},col);
    state.revealed[state.idx]=true; render();
  });
}

// ============ RUNNING SUMMARY (own screen) ============
function renderRunsum(item){
  const parts = buildIds.filter(i=>i<=state.idx && state.revealed[i]).map(i=>FLOW[i].part);
  const freshIdx = parts.length-1;
  const lis = parts.map((p,i)=>`<li class="${i===freshIdx?"fresh":""}">${esc(p)}</li>`).join("");
  stage.innerHTML = `
    <div class="card">
      <div class="stage-tag">${esc(item.tag||"Your running summary")}</div>
      ${item.heading?`<h2>${esc(item.heading)}</h2>`:""}
      ${item.html?item.html:""}
      <div class="runsum"><div class="runsum-label">${esc(item.label||"Your running summary")}</div><ol>${lis}</ol></div>
      ${item.outro?`<p class="runsum-outro">${item.outro}</p>`:""}
    </div>`;
}

// ============ POPUP after a build question ============
function showBuildPop(part, label){
  const back=document.createElement("div");
  back.className="pop-back";
  back.innerHTML=`<div class="pop"><div class="pop-label">${esc(label||"The line this lesson argues")}</div><div class="pop-text">${esc(part)}</div><button class="pop-btn" id="pop-ok">Got it</button></div>`;
  document.body.appendChild(back);
  document.getElementById("pop-ok").addEventListener("click",()=>back.remove());
}

// ============ NAV ============
function syncNav(isQuestion){
  nav.classList.remove("hidden");
  backBtn.disabled=false;
  backBtn.innerHTML = state.idx===0 ? "&larr; Back to the start" : "&larr; Back";
  nextBtn.style.display="";
  nextBtn.disabled = isQuestion ? !state.revealed[state.idx] : false;
  nextBtn.innerHTML = state.idx===FLOW.length-1 ? "See results &rarr;" : "Continue &rarr;";
}
// interactive items: replace Continue with a Check button until answered
function syncNavInteractive(canCheck, answered, onCheck){
  nav.classList.remove("hidden");
  backBtn.disabled=false;
  backBtn.innerHTML = state.idx===0 ? "&larr; Back to the start" : "&larr; Back";
  if(answered){
    nextBtn.style.display="";
    nextBtn.disabled=false;
    nextBtn.innerHTML = state.idx===FLOW.length-1 ? "See results &rarr;" : "Continue &rarr;";
    nextBtn.onclick = defaultNext;
  } else {
    nextBtn.style.display="";
    nextBtn.disabled=!canCheck;
    nextBtn.innerHTML="Check &rarr;";
    nextBtn.onclick = ()=>{ onCheck(); };
  }
}

function defaultNext(){
  // fire the running-summary popup when leaving a build question
  const cur=FLOW[state.idx];
  if(cur && cur.build && state.revealed[state.idx] && !state.poppedBuild[state.idx]){
    state.poppedBuild[state.idx]=true;
    showBuildPop(cur.part, cur.buildLabel);
  }
  if(state.idx<FLOW.length-1){ state.idx++; render(); } else showResults();
}

nextBtn.onclick = defaultNext;
backBtn.addEventListener("click",()=>{
  if(state.idx<=0){ state.idx=-1; renderCover(); }
  else { state.idx--; render(); }
});

// ============ RENDER DISPATCH ============
function render(){
  window.scrollTo({top:0,behavior:"instant"});
  if(state.idx===-1){ renderCover(); return; }
  topBar.classList.remove("hidden");
  document.getElementById("step-count").textContent=`Step ${state.idx+1} of ${FLOW.length}`;
  document.getElementById("fill").style.width=((state.idx+1)/FLOW.length*100)+"%";
  const item=FLOW[state.idx];
  nextBtn.onclick = defaultNext;
  switch(item.type){
    case "story": renderStory(item); syncNav(false); break;
    case "carousel": renderCarousel(item); /* nav handled inside */ syncNavCarousel(); break;
    case "stat": renderStat(item); syncNav(false); break;
    case "source": renderSource(item); syncNav(false); break;
    case "question": renderQuestion(item); break;
    case "runsum": renderRunsum(item); syncNav(false); break;
    default: renderContent(item); syncNav(false);
  }
}
function syncNavCarousel(){
  nav.classList.remove("hidden");
  backBtn.disabled=false;
  backBtn.innerHTML = state.idx===0 ? "&larr; Back to the start" : "&larr; Back";
  nextBtn.style.display="";
  nextBtn.innerHTML = state.idx===FLOW.length-1 ? "See results &rarr;" : "Continue &rarr;";
  // disabled state already set inside renderCarousel
}

function bindToggles(){
  bindPeek();
  stage.querySelectorAll("[data-toggle]").forEach(b=>b.addEventListener("click",()=>{
    b.nextElementSibling.classList.toggle("open");
  }));
}

// ============ RESULTS ============
function showResults(){
  topBar.classList.add("hidden");
  nav.classList.add("hidden");
  let correct=0;
  assessedIds.forEach(i=>{ if(isRight(i)) correct++; });
  const total=assessedIds.length;
  const pct = total?Math.round(correct/total*100):0;
  let band="", desc="";
  if(pct>=85){ band="Excellent"; desc=RESULTS.bands.excellent; }
  else if(pct>=70){ band="Strong"; desc=RESULTS.bands.strong; }
  else if(pct>=55){ band="Solid"; desc=RESULTS.bands.solid; }
  else if(pct>=40){ band="Patchy"; desc=RESULTS.bands.patchy; }
  else { band="Start again"; desc=RESULTS.bands.start; }
  const rows=spine().map(sp=>{
    const ids=assessedIds.filter(i=>FLOW[i].level===sp);
    if(!ids.length) return "";
    const g=ids.filter(i=>isRight(i)).length;
    const p=Math.round(g/ids.length*100);
    return `<div class="bd-row"><div class="bd-name">${sp}</div><div class="bd-bar"><div class="bd-fill" style="width:${p}%"></div></div><div class="bd-score">${g}/${ids.length}</div></div>`;
  }).join("");
  const parts=buildIds.filter(i=>state.revealed[i]).map(i=>FLOW[i].part);
  const runsum = parts.length?`<div class="breakdown"><div class="breakdown-label">Your running summary</div><ol style="margin:0;padding-left:1.3rem;">${parts.map(p=>`<li style="font-size:0.98rem;line-height:1.62;margin-bottom:0.6rem;">${esc(p)}</li>`).join("")}</ol></div>`:"";
  stage.innerHTML = `
    <div class="results-head">
      <div class="results-eyebrow">${RESULTS.eyebrow||"Lesson report"}</div>
      <h1 class="results-title">${esc(RESULTS.title||"Where you stand")}</h1>
    </div>
    <div class="score-row">
      <div class="score-block"><div class="score-num">${correct}<span class="score-den">/${total}</span></div><div class="score-label">Correct</div></div>
      <div class="score-block"><div class="score-num">${pct}<span class="score-den">%</span></div><div class="score-label">Accuracy</div></div>
      <div class="score-block"><div class="score-word">${band}</div><div class="score-label">Band</div></div>
    </div>
    <div class="grade-desc">${desc}</div>
    <div class="breakdown"><div class="breakdown-label">By skill</div>${rows}</div>
    ${runsum}
    <div class="results-actions">
      <button class="btn-secondary" id="restart-btn">Restart lesson</button>
      <button class="btn-primary" id="finish-btn">Finish &rarr;</button>
    </div>
    ${RESULTS.footer?`<div style="text-align:center;margin-top:1.1rem;font-size:0.92rem;color:var(--fade);">${esc(RESULTS.footer)}</div>`:""}`;
  document.getElementById("restart-btn").addEventListener("click",()=>{
    state.idx=-1; state.answers={}; state.revealed={}; state.order={}; state.carRead={}; state.interState={}; state.poppedBuild={};
    renderCover();
  });
  document.getElementById("finish-btn").addEventListener("click",()=>{
    const back=document.createElement("div");
    back.className="pop-back";
    const D = RESULTS.done||{};
    back.innerHTML=`<div class="pop"><div class="pop-label">${esc(D.label||"Lesson complete")}</div>${D.title?`<h3 style="margin:.4rem 0 .2rem;font-size:1.05rem;">${esc(D.title)}</h3>`:""}<div class="pop-text">${esc(D.text||"Tap Done to continue to the next lesson.")}</div><button class="pop-btn" id="fin-ok">Done</button></div>`;
    document.body.appendChild(back);
    document.getElementById("fin-ok").addEventListener("click",()=>back.remove());
  });
}

function isRight(i){
  const item=FLOW[i]; const ans=state.answers[i];
  if(ans===undefined) return false;
  if(item.mode==="order") return JSON.stringify(ans)===JSON.stringify(item.answer);
  if(item.mode==="sort"){ return item.items.every((_,ci)=>ans[ci]===item.answer[ci]); }
  return ans===item.correct;
}

renderCover();
})();


/* ---- MODE TOGGLE ---------------------------------------------------------
   Injects its own button so there is no stray markup, and lives inside the
   single script block so a first-to-last script extraction still parses. */
(function(){
  var NATIVE = "light";
  try{ if(localStorage.getItem("kula-mode")==="alt"){ document.body.classList.add("alt"); } }catch(e){}
  var SUN='<circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/>';
  var MOON='<path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1z"/>';
  var b=document.getElementById("mode-toggle");
  if(!b){
    b=document.createElement("button");
    b.className="mode-toggle"; b.id="mode-toggle"; b.type="button";
    b.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true" id="mode-icon"></svg><span id="mode-label"></span>';
    document.body.appendChild(b);
  }
  var lab=document.getElementById("mode-label"), ic=document.getElementById("mode-icon");
  function paint(){
    var onAlt=document.body.classList.contains("alt");
    var showing = onAlt ? (NATIVE==="dark" ? "light" : "dark") : NATIVE;
    var offering = showing==="dark" ? "light" : "dark";
    lab.textContent = offering==="light" ? "Light Mode" : "Dark Mode";
    ic.innerHTML = offering==="light" ? SUN : MOON;
    b.setAttribute("aria-pressed", onAlt ? "true" : "false");
    b.setAttribute("aria-label", "Switch to " + offering + " mode");
  }
  b.addEventListener("click",function(){
    var onAlt=document.body.classList.toggle("alt");
    try{ localStorage.setItem("kula-mode", onAlt ? "alt" : "native"); }catch(e){}
    paint();
  });
  paint();

})();
</script>
